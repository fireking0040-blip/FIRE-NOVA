
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRE NOVA AI</title>

<style>
body {
  background: #080d19;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px 15px;
}
h1 { color: #40c8ff; }

.core {
  width: 145px;
  height: 145px;
  border: 3px solid #40c8ff;
  border-radius: 50%;
  margin: 40px auto;
  display: grid;
  place-items: center;
  font-size: 45px;
  box-shadow: 0 0 30px #168dff;
}

button {
  background: #087fc9;
  color: white;
  padding: 15px 22px;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  margin: 8px;
}

#reply {
  color: #40c8ff;
  margin-top: 25px;
}
#heard {
  color: #ddd;
  min-height: 25px;
}
</style>
</head>

<body>

<h1>FIRE NOVA</h1>
<p>PERSONAL AI ASSISTANT</p>

<div class="core">N</div>

<button onclick="startListening()">
🎙️ TALK TO NOVA
</button>

<button onclick="speak('Hello King. FIRE NOVA is online.')">
🔊 TEST VOICE
</button>

<p id="heard">Waiting for your command...</p>
<p id="reply">System ready.</p>

<script>

function speak(message) {
  if (!("speechSynthesis" in window)) {
    document.getElementById("reply").innerText =
      "Speech output is not supported here.";
    return;
  }

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(message);
  voice.lang = "en-IN";
  voice.rate = 0.95;

  window.speechSynthesis.speak(voice);

  document.getElementById("reply").innerText = message;
}

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("reply").innerText =
      "Voice recognition is not supported. Try Chrome.";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  document.getElementById("heard").innerText =
    "Listening...";

  document.getElementById("reply").innerText =
    "Speak now, King.";

  recognition.onresult = function(event) {

    const command =
      event.results[0][0].transcript.toLowerCase();

    document.getElementById("heard").innerText =
      "You said: " + command;

    processCommand(command);
  };

  recognition.onerror = function(event) {
    document.getElementById("reply").innerText =
      "Voice error: " + event.error;
  };

  recognition.onend = function() {
    console.log("Listening stopped.");
  };

  try {
    recognition.start();
  } catch(error) {
    document.getElementById("reply").innerText =
      "Could not start microphone. Try again.";
  }
}

function processCommand(command) {

  if (command.includes("hello")) {
    speak("Hello King. How can I help you?");
  }

  else if (command.includes("your name")) {
    speak("I am FIRE NOVA, your personal AI assistant.");
  }

  else if (command.includes("time")) {
    speak("The time is " +
      new Date().toLocaleTimeString());
  }

  else if (command.includes("who are you")) {
    speak("I am FIRE NOVA. Your personal assistant.");
  }

  else {
    speak("I heard you. This command is not yet programmed.");
  }
}

</script>

</body>
</html>
